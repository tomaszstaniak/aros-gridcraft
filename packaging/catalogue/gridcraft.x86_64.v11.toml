id              = "gridcraft"
version         = "0.19.1"
revision        = 2
summary         = "Spreadsheet for XLSX, ODS and CSV with formulas and PDF export"
category        = "office/spreadsheet"
license         = "MIT OR Apache-2.0"
kind            = "app"
arch            = "x86_64"
abi             = "v11"
subdir          = "GridCraft"
icon            = "GridCraft.info"
depends         = []
depends_checked = true
post_install_notes = [
  "x86_64 ABIv11 distributions; tested on AROS One 1.3.",
  "The CPU renderer redraws only the parts of the window that changed; scrolling, zooming and other changes of the whole window are slower on slow machines.",
  "GUI_RENDERER ToolType: AUTO (default), CPU or GPU. AUTO uses OpenGL only when it is not Mesa software OpenGL.",
  "Settings, recent files and GridCraft.log are kept in GridCraftData in the program drawer; keep it when upgrading.",
  "No printing. Updates come through the AROS package manager.",
]

# System libraries the programs open: C runtime first, then window, pictures and requesters.

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[[requires_system]]
type = "library"
id   = "asl.library"

[[requires_system]]
type = "library"
id   = "datatypes.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-gridcraft"
revision   = "v0.19.1-r2"
archive    = "GridCraft-0.19.1-r2-source.zip"
built_with = "x86_64 ABIv11, GCC 10.5.0, Rust nightly 1.100 (rust-aros), egui 0.37 through egui-aros"

[launch]
executable = "GridCraft"
mode       = "workbench"
